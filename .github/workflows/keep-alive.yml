# 每 5 分鐘訪問一次網站，避免 Render 免費方案因閒置 15 分鐘而休眠
name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          curl -sS -m 90 --retry 2 --retry-delay 15 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://stock-system-kn5v.onrender.com/healthz || echo "ping failed (site may be waking up)"
